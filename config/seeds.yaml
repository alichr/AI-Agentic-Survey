# Seed topics for AI Agentic survey clustering.
# Each seed has a name and per-view descriptions (0–4) that capture
# the topic's signature in each section view.

- name: "Agentic LLM Systems"
  descriptions:
    0: >
      Autonomous large language model agents that perceive environments,
      reason over goals, and take actions through tool use and API calls.
      Architectures such as ReAct, Toolformer, and function-calling frameworks
      enable LLMs to operate as goal-directed agents with planning, memory,
      and self-reflection capabilities.
    1: >
      Recent advances show that large language models can serve as the
      cognitive core of autonomous agents. By augmenting LLMs with external
      tool access, retrieval-augmented generation, and structured planning
      loops, researchers have built systems that complete complex real-world
      tasks end-to-end with minimal human supervision.
    2: >
      Prior work on LLM-based agents spans tool-augmented language models,
      chain-of-thought and tree-of-thought prompting, self-debugging code
      agents, and web navigation agents. Frameworks like LangChain, AutoGPT,
      and BabyAGI pioneered modular agent architectures with memory and
      planning components.
    3: >
      The proposed method equips a large language model with an action space
      of tools, a working memory buffer, and a planning module that
      decomposes high-level goals into executable sub-tasks. The agent
      iteratively observes environment feedback, updates its plan, and
      selects the next action using structured reasoning traces.
    4: >
      Experiments evaluate the agent on multi-step task completion benchmarks
      such as WebArena, SWE-bench, GAIA, and ToolBench. Metrics include
      task success rate, number of steps to completion, tool call accuracy,
      and robustness to error recovery across diverse domains.

- name: "Multi-Agent Collaboration"
  descriptions:
    0: >
      Systems of multiple AI agents that communicate, coordinate, and
      collaborate to solve tasks beyond the capability of any single agent.
      Multi-agent frameworks assign specialised roles — planner, coder,
      critic, executor — and use structured debate, delegation, or
      negotiation protocols to reach joint solutions.
    1: >
      Scaling from single-agent to multi-agent systems addresses bottlenecks
      in complex problem solving. By distributing sub-tasks across specialised
      agents with complementary skills and enabling inter-agent communication,
      multi-agent collaboration achieves higher accuracy and broader coverage
      than monolithic approaches.
    2: >
      Related research includes cooperative multi-agent reinforcement
      learning, LLM-powered society-of-mind architectures, debate and
      self-play for answer verification, role-playing agent frameworks such
      as CAMEL and MetaGPT, and orchestration platforms like AutoGen and
      CrewAI that manage agent workflows.
    3: >
      The method defines a team of agents with distinct roles and a
      communication protocol. A manager agent decomposes the task and
      delegates sub-problems; worker agents execute using their specialised
      tools; a critic agent reviews outputs and requests revisions. Message
      passing follows a structured graph topology with optional consensus
      rounds.
    4: >
      Evaluation uses collaborative benchmarks such as ChatDev software
      generation, multi-agent coding challenges, collaborative writing tasks,
      and debate-based QA. Metrics include solution correctness, inter-agent
      message efficiency, role utilisation balance, and speedup compared to
      single-agent baselines.
