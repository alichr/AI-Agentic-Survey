pipeline:
  output_dir: "output"
  cache_dir: "cache"
  relevance_threshold: 5
  max_classify_concurrent: 20
  log_level: "INFO"

vllm:
  base_url: "http://localhost:8001/v1"
  model_name: "Qwen/Qwen3-30B-A3B-Instruct-2507-FP8"
  temperature: 0.3
  max_tokens: 512

download:
  max_concurrent: 30
  max_retries: 3
  retry_backoff: 2.0
  timeout: 60
