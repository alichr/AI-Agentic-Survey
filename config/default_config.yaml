pipeline:
  papers_dir: "papers"
  output_dir: "output_seedless"
  cache_dir: "cache"
  log_level: "INFO"

vllm:
  model_name: "Qwen/Qwen3-30B-A3B-Instruct-2507-FP8"
  base_url: "http://localhost:8000/v1"
  tensor_parallel_size: 2
  max_model_len: 64000
  gpu_memory_utilization: 0.90

embedding:
  model_name: "Qwen/Qwen3-Embedding-4B"
  device: "cuda:2"
  batch_size: 16

section_extraction:
  max_concurrent: 20
  max_text_chars: 100000
  temperature: 0.3
  max_tokens: 1024
  summary_target_words: 400  # Target word count for section summaries (try 200 for tighter embeddings)

kmeans:
  n_clusters: 10
  n_init: 10
  random_state: 42
  enabled_views: [0, 1, 2, 3, 4]
  weak_member_percentile: 90.0
  pca_components: 50  # PCA dim reduction before K-Means (0 = disabled)

hindex:
  enabled: true
  max_hindex_baseline: 50
  default_score: 0.3
  cache_max_age_days: 30
  rate_limit_rps: 1.0  # Semantic Scholar free tier: ~1 req/sec

affiliation:
  enabled: true
  university_rankings_path: "config/university_rankings.csv"
  company_tiers_path: "config/company_tiers.yaml"
  first_author_weight: 0.5
  last_author_weight: 0.5

citation:
  enabled: true
  source: "openalex"  # "openalex" (recommended) or "semantic_scholar"
  openalex_api_key: null  # Free key from openalex.org/settings/api (100k credits/day)
  openalex_email: null  # Optional email for polite pool access
  semantic_scholar_api_key: null
  rate_limit_rps: 10.0
  max_retries: 3
  cache_max_age_days: 30
  expected_citations: {0: 5, 1: 15, 2: 40, 3: 80, 4: 120, 5: 160}
  expected_citations_slope: 30
