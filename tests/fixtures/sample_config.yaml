pipeline:
  papers_dir: "test_papers"
  seed_papers_dir: "test_seed_papers"
  seed_papers_config: "test_seed_papers.yaml"
  output_dir: "test_output"
  cache_dir: "test_cache"
  log_level: "WARNING"

vllm:
  model_name: "test-model"
  base_url: "http://localhost:9999/v1"
  tensor_parallel_size: 1
  max_model_len: 2048
  gpu_memory_utilization: 0.5

embedding:
  model_name: "test-embedding-model"
  device: "cpu"
  batch_size: 8

clustering:
  n_clusters: 3
  method: "gmm"
  dimensionality_reduction: false
  reduced_dim: 64

relevance:
  enabled: true
  threshold: 0.3

affiliation:
  enabled: true
  threshold: 0.3
  university_rankings_path: "test_rankings.csv"
  company_tiers_path: "test_tiers.yaml"
  first_author_weight: 0.5
  last_author_weight: 0.5

citation:
  enabled: true
  threshold: 0.2
  semantic_scholar_api_key: null
  rate_limit_rps: 10.0
  max_retries: 2
  cache_max_age_days: 30
  expected_citations: {0: 5, 1: 15, 2: 40, 3: 80, 4: 120, 5: 160}
  expected_citations_slope: 30
